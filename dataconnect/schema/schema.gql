type User @table {
  displayName: String!
  email: String!
  role: String!
  createdAt: Timestamp!
  photoUrl: String
  lastLogin: Timestamp
}

type Artist @table {
  name: String!
  genre: String!
  status: String!
  createdAt: Timestamp!
  bio: String
  contactEmail: String
  website: String
  socialMediaLinks: [String]
  manager: User
}

type Release @table {
  artist: Artist!
  title: String!
  releaseType: String!
  releaseDate: Date!
  createdAt: Timestamp!
  artworkUrl: String
  description: String
  distributor: String
}

type Track @table {
  release: Release!
  title: String!
  duration: Int!
  trackNumber: Int!
  createdAt: Timestamp!
  audioFileUrl: String
  lyrics: String
}

type Event @table {
  name: String!
  eventType: String!
  eventDate: Timestamp!
  location: String!
  createdAt: Timestamp!
  description: String
  venue: String
  ticketLink: String
  capacity: Int
}

type ArtistEvent @table(key: ["artist", "event"]) {
  artist: Artist!
  event: Event!
}

type Task @table {
  title: String!
  status: String!
  priority: String!
  assignedTo: User!
  createdAt: Timestamp!
  description: String
  dueDate: Timestamp
  completedAt: Timestamp
}