---
deployment:
  tasks:
    # 1) Paths
    - export DEPLOYPATH=/home/grinircc/public_html

    # 2) Install
    - /usr/local/bin/npm ci || /usr/local/bin/npm install --legacy-peer-deps

    # 3) Build static site (requires "export" in package.json scripts)
    #    "build": "next build",
    #    "export": "next export"
    - /usr/local/bin/npm run build
    - /usr/local/bin/npm run export

    # 4) Deploy only the static output
    - /usr/bin/rsync -a --delete out/ $DEPLOYPATH
    git add . && git commit -m "Test deploy" && git push origin main
